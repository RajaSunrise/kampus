{{define "content"}}
<div class="w-full">
    <div class="bg-gray-900 py-16 relative overflow-hidden">
        <div class="absolute inset-0 z-0 bg-cover bg-center opacity-40" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCW3m1YaA8bc1bpROcMkHXzxiFyyAmenO8hRMPlQCW-NBXjuhXXRv8chfZtOcJRWLdbFPZyps_mT2bBkrMAcy1XoKlwvtMLS6_SLrGDgzVkhEXiEDMt1M1DfJuDTcHBC6xiM30-mzla9UWU_CAquNWx-oYnIDII6eBlDh944QvBPR3CPOa4NT9Nhm19UMCo0vgt0VEyBWS0qySL0mML3Mi2WLwFCuKwxAZ-7PIO_d589zImg-Lc3BWSh195DZ59MS7d768SJl88Ntgy")'></div>
        <div class="relative z-10 max-w-[1280px] mx-auto px-4 text-center">
            <h1 class="text-4xl font-black text-white mb-4">Get in Touch</h1>
            <p class="text-gray-300 text-lg">We are here to help you navigate your journey at UTM.</p>
        </div>
    </div>
    <div class="max-w-[1280px] mx-auto px-4 py-16 grid grid-cols-1 lg:grid-cols-2 gap-12">
        <div class="flex flex-col gap-6">
            <h2 class="text-2xl font-bold">Contact Information</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="p-5 bg-white border rounded-xl shadow-sm">
                    <span class="material-symbols-outlined text-primary text-3xl mb-2">location_on</span>
                    <h3 class="font-bold">Visit Us</h3>
                    <p class="text-sm text-gray-600">Jl. Kampus Raya No. 123, Mataram</p>
                </div>
                <div class="p-5 bg-white border rounded-xl shadow-sm">
                    <span class="material-symbols-outlined text-primary text-3xl mb-2">call</span>
                    <h3 class="font-bold">Call Us</h3>
                    <p class="text-sm text-gray-600">+62 370 123456</p>
                </div>
            </div>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow-sm border">
            <h2 class="text-2xl font-bold mb-6">Send a Message</h2>
            <form class="space-y-4">
                <input type="text" placeholder="Full Name" class="w-full p-3 border rounded-lg" />
                <input type="email" placeholder="Email Address" class="w-full p-3 border rounded-lg" />
                <textarea placeholder="Message" rows="4" class="w-full p-3 border rounded-lg"></textarea>
                <button class="w-full py-3 bg-primary text-white font-bold rounded-lg hover:bg-blue-600">Send Message</button>
            </form>
        </div>
    </div>
</div>
{{end}}
